<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Google Sans Flex',sans-serif;color:#0f1718}
body{min-height:100svh;display:grid;place-items:center;background:#e9ebed}
.phone-frame{width:min(390px,calc((100svh - 48px)*.462085),calc(100vw - 48px));aspect-ratio:390/844;border:1.5px solid #505657;border-radius:27px;padding:7px;background:#fff;box-shadow:0 18px 60px #23303320;overflow:hidden}
.phone-screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:19px;background:#fff;isolation:isolate;container-type:inline-size}
.opening{position:absolute;inset:0;overflow:hidden;background:#fff;z-index:1;transition:opacity .55s ease}
.poster-grid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;pointer-events:none}
.topline{position:absolute;z-index:2;top:5.1%;left:7%;right:7%;display:flex;justify-content:space-between;gap:12px;font-size:clamp(11px,1.7svh,14px);line-height:1.33;letter-spacing:-.025em;font-weight:520}
.topline p{margin:0}.topline p:last-child{text-align:right}
#main-svg{position:absolute;width:88%;height:74%;left:6%;top:16%;overflow:visible;z-index:2}
#main-svg>g{transform-box:fill-box;transform-origin:center;transition:transform 1.1s cubic-bezier(.2,.74,.2,1)}
.opening.open #main-svg>g:nth-of-type(1){transform:translate(43px,28px)}
.opening.open #main-svg>g:nth-of-type(2){transform:translate(-52px,32px)}
.opening.open #main-svg>g:nth-of-type(3){transform:translate(45px,-35px)}
.opening.open #main-svg>g:nth-of-type(4){transform:translate(-51px,-20px)}
.opening.open #main-svg>g:nth-of-type(5){transform:translate(-49px,-30px)}
.opening.open #main-svg>g:nth-of-type(6){transform:translate(-57px,18px)}
.candy{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
.confetti{position:absolute;z-index:6;pointer-events:none;will-change:transform,opacity}
.final-screen{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:36px 32px;background:#f4f4f6;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s ease}
.final-screen.visible{opacity:1;visibility:visible}
.final-text-box{color:#231f20;font-family:'Google Sans Flex',sans-serif;width:100%;text-align:justify;word-break:break-all;line-height:1.7;font-size:clamp(14px,3.8cqw,18.5px);font-weight:700;user-select:none;margin:auto}
.final-members-text{margin-top:24px;text-align:center}
.final-cta-wrap{margin-top:26px;text-align:center}
.final-cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;background:#231f20;color:#fff;text-decoration:none;border-radius:4px;font-weight:800;font-size:clamp(13px,3.4cqw,14.5px);border:none;box-shadow:none;opacity:0;pointer-events:none;transition:opacity .6s ease}
.final-cta-btn.visible{opacity:1;pointer-events:auto}
.fch{display:none}
@media(max-width:600px){body{display:block;background:#fff}.phone-frame{width:100vw;height:100svh;aspect-ratio:auto;border:0;border-radius:0;padding:0;box-shadow:none}.phone-screen{border-radius:0}}
@media(prefers-reduced-motion:reduce){#main-svg>g,.opening,.final-screen{transition:none!important}}
</style>
</head>

<audio id="typing-audio" src="assets/typing.mp3" preload="auto" loop></audio>
<audio id="pop-audio" src="assets/pop.mp3" preload="auto"></audio>
<audio id="whoosh-audio" src="assets/whoosh.mp3" preload="auto"></audio>
<script>
const FINAL_MAIN_HTML = `<span style="background:#e4007f;color:#fff;padding:0.2px 2px;">제 목에 걸린 사탕</span>을 <span style="color:#8cc63f">빼주실 분</span>을 <span style="background:#fff100;color:#000;padding:0.2px 2px;">초대합니다.</span><br/><br/><span style="color:#e60012">오래</span> 준비한 <span style="color:#e60012">이야기</span>들을 드디어 <span style="background:#8cc63f;color:#000;padding:0.2px 2px;">DDP</span>에 <span style="background:#fff100;color:#000;padding:0.2px 2px;">꺼내놓습니다.</span> 이제 <span style="color:#8cc63f">정말</span> 끝이라고 <span style="color:#00a1e9">생각</span>했습니다. <span style="color:#8cc63f">그런데</span> 보여드리고 싶은 건 <span style="background:#66c0f4;color:#000;padding:0.2px 2px;">아직</span> 많더라고요. 그래서 <span style="background:#e4007f;color:#fff;padding:0.2px 2px;">준비했습니다.</span> 한 번쯤 꼭 <span style="background:#f37021;color:#fff;padding:0.2px 2px;">보러</span> 와주세요...<br/><br/><span style="color:#e60012">홍익대학교</span> 디자인컨버전스학부 <span style="background:#8cc63f;color:#000;padding:0.2px 2px;">DDP</span> <span style="background:#fff100;color:#e4007f;padding:0.2px 2px;">졸업전시</span><br/><span style="background:#8cc63f;color:#000;padding:0.2px 2px;">2026. 12. 01–12. 05</span> / 12.01–12.04 10:00–20:00 / 12.05 10:00–18:00 <span style="background:#66c0f4;color:#000;padding:0.2px 2px;">DDP 아트홀 2관 A-29</span>`;
const FINAL_MEMBERS_HTML = `<div style="font-weight:800;margin-bottom:6px;color:#231f20;background:#fff100;display:inline-block;padding:2px 7px;border-radius:4px;font-size:clamp(13.5px, 3.5cqw, 16px);">참여자</div><div style="font-size:clamp(11.5px, 3.0cqw, 14px);line-height:1.75;color:#333333;font-weight:600;margin-top:4px;">강예은 · 김서윤 · 김예준 · 김주희 · 김창래 · 김희서 · 모소연 · 박시형 · 박정연 · 박지혜 · 손예림 · 양서경 · 왕은빈 · 이채빈 · 장지혁 · 정규태 · 조유정 · 진아름 · 황예은</div>`;
const screen=document.getElementById('phone-screen');
const opening=document.getElementById('opening');
const svg=document.getElementById('main-svg');
const finalScreen=document.getElementById('final-screen');
const typeAudio=document.getElementById('typing-audio');
const popAudio=document.getElementById('pop-audio');
const whooshAudio=document.getElementById('whoosh-audio');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let soundEnabled=false;
function enableSound(){soundEnabled=true;document.removeEventListener('pointerdown',enableSound);if(finalScreen.classList.contains('visible')&&finalChars.some(c=>c.style.display==='none'))typeAudio.play().catch(()=>{})}
document.addEventListener('pointerdown',enableSound,{once:true});
function play(audio,volume){if(!soundEnabled)return;try{const a=audio.cloneNode();a.volume=volume;a.play().catch(()=>{})}catch(e){}}
function triggerHaptic(){if('vibrate' in navigator)navigator.vibrate(6)}
function wrapFinalNodes(node){let result='';node.childNodes.forEach(child=>{if(child.nodeType===3){for(const ch of child.textContent)result+=`<span class="fch" style="display:none;">${ch==='<'?'&lt;':ch==='&'?'&amp;':ch}</span>`}else if(child.nodeType===1){const tag=child.tagName.toLowerCase();if(tag==='br')result+='<br/>';else{let attrs='';for(const attr of child.attributes)attrs+=` ${attr.name}="${attr.value}"`;result+=`<${tag}${attrs}>${wrapFinalNodes(child)}</${tag}>`}}});return result}
const tempMain=document.createElement('div');tempMain.innerHTML=FINAL_MAIN_HTML;document.getElementById('final-main-text').innerHTML=wrapFinalNodes(tempMain);
const tempMemb=document.createElement('div');tempMemb.innerHTML=FINAL_MEMBERS_HTML;document.getElementById('final-members-text').innerHTML=wrapFinalNodes(tempMemb);
const finalChars=[...document.querySelectorAll('.fch')];
function startFinalTyping(){finalScreen.classList.add('visible');if(reducedMotion){finalChars.forEach(c=>c.style.display='inline');document.getElementById('final-cta-btn').classList.add('visible');return}if(soundEnabled){typeAudio.volume=.6;typeAudio.playbackRate=1.5;typeAudio.currentTime=0;typeAudio.play().catch(()=>{})}let fIdx=0;const timer=setInterval(()=>{if(fIdx<finalChars.length){finalChars[fIdx].style.display='inline';triggerHaptic();fIdx++}else{clearInterval(timer);typeAudio.pause();typeAudio.loop=false;document.getElementById('final-cta-btn').classList.add('visible')}},38)}
const candyRects=[...svg.querySelectorAll('g > rect[rx]')].filter(el=>el.getAttribute('fill'));
const candies=candyRects.map(el=>{const clone=el.cloneNode(true);clone.removeAttribute('id');clone.classList.add('candy');svg.appendChild(clone);el.style.visibility='hidden';return clone});
const trails=[[[0,0],[0,-24],[29,-24],[29,-67],[72,-67],[100,-110]],[[0,0],[0,-27],[0,-48],[-45,-48],[-45,-94],[-95,-94]],[[0,0],[0,26],[30,26],[30,-20],[75,-20],[105,-85]],[[0,0],[28,0],[28,26],[68,26],[68,-30],[110,-60]],[[0,0],[0,-27],[42,-27],[42,-68],[91,-68],[130,-110]],[[0,0],[0,-32],[0,-91],[-39,-91],[-39,-153],[-88,-184]]];
const palette=['#84c779','#f04f2c','#db58a0','#faed28','#61bcea','#9a70b6'];
function scatter(rect,seed){const screenBox=screen.getBoundingClientRect(),box=rect.getBoundingClientRect(),x=box.left+box.width/2-screenBox.left,y=box.top+box.height/2-screenBox.top;const w=screen.clientWidth,h=screen.clientHeight;for(let i=0;i<42;i++){const piece=document.createElement('i');piece.className='confetti';const size=5+(i%4)*2;piece.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-radius:${i%3===0?'2px':'50%'};background:${palette[(i+seed)%palette.length]}`;screen.appendChild(piece);const col=(i*17+seed*11)%14,row=(i*7+seed*13)%18;const endX=(col+.5)/14*w,endY=(row+.5)/18*h;piece.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1,offset:0},{transform:`translate(${endX-x}px,${endY-y}px) scale(1)`,opacity:1,offset:.7},{transform:`translate(${endX-x}px,${endY-y+35}px) scale(.7)`,opacity:0,offset:1}],{duration:1500+(i%5)*90,easing:'cubic-bezier(.14,.65,.27,1)',fill:'forwards'}).onfinish=()=>piece.remove()}}
function release(){play(whooshAudio,.5);candies.forEach((ball,i)=>{const points=trails[i],frames=points.map((p,j)=>({transform:`translate(${p[0]}px,${p[1]}px) scale(${j===points.length-1?1.2:1})`,opacity:j===points.length-1?0:1,offset:j/(points.length-1)}));ball.animate(frames,{duration:1050,delay:i*135,easing:'linear',fill:'forwards'});setTimeout(()=>{scatter(ball,i);play(popAudio,.5)},800+i*135)})}
function run(){const preview=new URLSearchParams(location.search).get('preview');if(preview==='opening')return;if(preview==='final'){opening.style.opacity='0';finalScreen.classList.add('visible');finalChars.forEach(c=>c.style.display='inline');document.getElementById('final-cta-btn').classList.add('visible');return}if(reducedMotion){opening.style.opacity='0';startFinalTyping();return}setTimeout(()=>opening.classList.add('open'),600);setTimeout(release,1550);setTimeout(()=>{opening.style.opacity='0';startFinalTyping()},3550)}
run();
</script>

</html>
