.scroll-track{position:absolute;inset:0;overflow:hidden;scrollbar-width:none;overscroll-behavior:contain;touch-action:none}
.scroll-track.unlocked{overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.scroll-track::-webkit-scrollbar{display:none}
.opening{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}

#poster-letters>g{transform-box:fill-box;transform-origin:center;transition:transform .58s cubic-bezier(.18,.82,.25,1)}

.candy{transform-box:fill-box;transform-origin:center;will-change:transform}
.falling-ball{position:absolute;z-index:7;border-radius:50%;pointer-events:none;will-change:transform}

.final-screen.visible{display:flex}
.final-screen.awaiting .final-text-box{visibility:hidden}
.final-text-box{color:#231f20;font-family:'Google Sans Flex',sans-serif;width:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:22px;text-align:left;word-break:keep-all;letter-spacing:-.02em;line-height:1.5;font-size:clamp(12px,3.4cqw,14px);font-weight:500;user-select:none;margin:0}

.detail-box.pending,.final-cta-wrap.pending,.final-logos.pending{visibility:hidden;opacity:0;transform:translateY(18px)}
.invite-lead,.invite-body{margin:0}
.invite-lead{font-size:clamp(19px,5.2cqw,23px);line-height:1.3;font-weight:550;white-space:nowrap}
.invite-body{margin-top:12px;font-size:clamp(13px,3.5cqw,15px);line-height:1.55;color:#393c3d}
.accent-title{color:#fff}
.accent-title .fch{background:var(--ink-pink)}
.accent-green{color:var(--ink-teal);font-weight:550}
.accent-red{color:var(--ink-coral);font-weight:550}
.accent-blue,.accent-yellow,.accent-lime,.accent-orange{color:#171717}
.accent-purple{color:#171717}
.accent-blue .fch{background:var(--c-blue)}
.accent-yellow .fch{background:var(--c-yellow)}
.accent-lime .fch{background:var(--c-lime)}
.accent-orange .fch{background:var(--c-coral)}
.accent-purple .fch{background:var(--c-lime)}
.section-label{display:block;font-size:11px;font-weight:650;line-height:1.35;margin-bottom:10px;color:#606667}
.final-members-text{text-align:left;min-width:0;margin-top:-6px}
.participant-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px 2px;font-size:clamp(10px,3cqw,12px);line-height:1.5;font-weight:500;color:#333;white-space:nowrap}
.final-logos{display:flex;align-items:center;justify-content:center;min-height:22px}
.final-logos img{display:block;width:min(60%,150px);height:auto}
#final-info-text{display:grid;gap:3px;line-height:1.4}
.venue{font-size:clamp(13px,3.8cqw,16px);font-weight:650}
.date{font-size:clamp(12px,3.5cqw,15px);font-weight:560}
.info-time{margin-top:6px;font-size:clamp(10px,2.9cqw,12px);font-weight:500;line-height:1.55;color:#555d5e}
.info-divider{padding:0 .15em;color:#6a7273}
.final-cta-wrap{display:grid;gap:5px;margin-top:0}
.final-cta-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:6px 10px;background:#231f20;color:#fff;text-decoration:none;border-radius:0;font-weight:700;font-size:12px;border:none;box-shadow:none;visibility:hidden;pointer-events:none}
.final-cta-btn.visible{visibility:visible;pointer-events:auto}
.fch{visibility:hidden}

<script>
const FINAL_MAIN_HTML = `<p class="invite-lead"><span class="accent-title">목에 걸린 사탕</span>을<br><span class="accent-green">함께 꺼내주실 여러분</span>을<br><span class="accent-lime">DDP</span>로 <span class="accent-yellow">초대합니다.</span></p><p class="invite-body"><span class="accent-red">오랜 시간</span> 준비한 이야기들을 <span class="accent-lime">DDP</span>에서 <span class="accent-yellow">선보입니다.</span> 끝이라고 생각한 뒤에도 <span class="accent-blue">전하고 싶은 이야기</span>가 남아 있었습니다. 귀한 걸음으로 <span class="accent-purple">함께해 주시면</span> <span class="accent-orange">감사하겠습니다.</span></p>`;
const FINAL_INFO_HTML = `<div class="venue">DDP 아트홀 2관 <span class="info-divider">·</span> A-29</div><div class="date">2026. 12. 01 <span class="info-divider">—</span> 12. 05</div><div class="info-time">화–금 10:00–20:00 <span class="info-divider">·</span> 토 10:00–18:00<br/>무료 관람 <span class="info-divider">·</span> 종료 30분 전 입장 마감</div>`;
const FINAL_MEMBERS_HTML = `<div class="section-label">참여 디자이너</div><div class="participant-grid"><span>강예은</span><span>강지혜</span><span>김서윤</span><span>김유빈</span><span>김주희</span><span>김창래</span><span>김해준</span><span>김희서</span><span>모소연</span><span>박지호</span><span>방태림</span><span>서유정</span><span>손예림</span><span>양서경</span><span>이채빈</span><span>전승아</span><span>정규태</span><span>진아름</span><span>최성근</span><span>황예은</span></div>`;
const screen=document.getElementById('phone-screen');
const track=document.getElementById('scroll-track');
const opening=document.getElementById('opening');
const svg=document.getElementById('main-svg');
const finalScreen=document.getElementById('final-screen');
const typeAudio=document.getElementById('typing-audio');
const popAudio=document.getElementById('pop-audio');
const whooshAudio=document.getElementById('whoosh-audio');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let soundEnabled=false;
function enableSound(){soundEnabled=true;document.removeEventListener('pointerdown',enableSound);if(finalScreen.classList.contains('visible')&&finalChars.some(c=>c.style.visibility==='hidden'))typeAudio.play().catch(()=>{})}
document.addEventListener('pointerdown',enableSound,{once:true});
function play(audio,volume){if(!soundEnabled)return;try{const a=audio.cloneNode();a.volume=volume;a.play().catch(()=>{})}catch(e){}}
function triggerHaptic(){if('vibrate' in navigator)navigator.vibrate(6)}
function wrapFinalNodes(node){let result='';node.childNodes.forEach(child=>{if(child.nodeType===3){for(const ch of child.textContent)result+=`<span class="fch" style="visibility:hidden;">${ch==='<'?'&lt;':ch==='&'?'&amp;':ch}</span>`}else if(child.nodeType===1){const tag=child.tagName.toLowerCase();if(tag==='br')result+='<br/>';else{let attrs='';for(const attr of child.attributes)attrs+=` ${attr.name}="${attr.value}"`;result+=`<${tag}${attrs}>${wrapFinalNodes(child)}</${tag}>`}}});return result}
const tempMain=document.createElement('div');tempMain.innerHTML=FINAL_MAIN_HTML;document.getElementById('final-main-text').innerHTML=wrapFinalNodes(tempMain);
document.getElementById('final-info-text').innerHTML=FINAL_INFO_HTML;
document.getElementById('final-members-text').innerHTML=FINAL_MEMBERS_HTML;
const finalChars=[...document.querySelectorAll('.fch')];
function showCallouts(){document.querySelector('.final-cta-wrap').classList.remove('pending');document.querySelector('.final-logos').classList.remove('pending');document.querySelectorAll('.final-cta-btn').forEach(a=>a.classList.add('visible'))}
function revealDetails(){const boxes=[document.querySelector('#final-info-text').closest('.detail-box'),document.querySelector('#final-members-text')];boxes.forEach((box,i)=>setTimeout(()=>box.classList.remove('pending'),220+i*480));setTimeout(showCallouts,1180)}
function startFinalTyping(){finalScreen.classList.remove('awaiting');finalScreen.classList.add('visible');if(reducedMotion){document.querySelectorAll('.detail-box.pending').forEach(b=>b.classList.remove('pending'));finalChars.forEach(c=>c.style.visibility='visible');showCallouts();return}if(soundEnabled){typeAudio.volume=.6;typeAudio.playbackRate=1.5;typeAudio.currentTime=0;typeAudio.play().catch(()=>{})}let fIdx=0;const timer=setInterval(()=>{if(fIdx<finalChars.length){finalChars[fIdx].style.visibility='visible';if(fIdx%3===0)triggerHaptic();fIdx++}else{clearInterval(timer);typeAudio.pause();typeAudio.loop=false;revealDetails()}},32)}
const candies=[...svg.querySelectorAll('#poster-candies .candy')];
const letterIds=['MOK-2','EH-2','GUL-2','LIN-2','SA-2','TANG-2'];
const letterGroups=letterIds.map(id=>document.getElementById(id));
function alignLetters(){
  const frame=screen.getBoundingClientRect();
  const centerX=frame.left+frame.width/2;
  const svgScale=svg.getScreenCTM()?.a||svg.getBoundingClientRect().width/800;
  letterGroups.forEach(group=>{
    const box=group.getBoundingClientRect();
    const offset=(centerX-(box.left+box.width/2))/svgScale;
    group.style.setProperty('--align-x',`${offset}px`);
  });
}
alignLetters();
candies.forEach((ball,i)=>letterGroups[i].appendChild(ball));
const strokePaths=[
  [[550,355],[552,355],[552,381],[610,381]],
  [[650,520],[642,520],[642,620]],
  [[965,690],[959,690],[959,715],[1019,715],[1019,805],[1078,805],[1078,859]],
  [[840,1080],[840,1098],[898,1098]],
  [[500,1260],[492,1260],[492,1336],[551,1336]],
  [[700,1560],[700,1576]]
];
const railEdges=[
  [610.5,381,381],[790.35,384,620],[1077.6,622,859],
  [897.96,862,1098],[610.5,1100,1336],[790.28,1339,1576]
];
const bottomSlots=[[790.28,1370],[790.28,1425],[790.28,1480],[790.28,1535],[755,1576],[700,1576]];
const fallingBalls=[];
function screenPoint(group,x,y){
  const point=new DOMPoint(x,y).matrixTransform(group.getScreenCTM());
  const frame=screen.getBoundingClientRect();
  return {x:point.x-frame.left,y:point.y-frame.top};
}
function pointOnRoute(route,distance){
  const {points,lengths}=route;
  for(let i=1;i<lengths.length;i++){
    if(distance>lengths[i])continue;
    const segment=lengths[i]-lengths[i-1]||1;
    const t=(distance-lengths[i-1])/segment;
    return {x:points[i-1].x+(points[i].x-points[i-1].x)*t,y:points[i-1].y+(points[i].y-points[i-1].y)*t};
  }
  return points.at(-1);
}
function animateStrokeRoutes(routes){
  return new Promise(resolve=>{
    const start=performance.now();let last=start;
    function step(now){
      const dt=Math.min((now-last)/16.67,2);last=now;
      const occupied=[];
      for(let i=routes.length-1;i>=0;i--){
        const route=routes[i];
        const t=Math.min(1,Math.max(0,now-start-route.delay)/route.duration);
        const target=route.total*t*t;
        let distance=Math.min(target,route.progress+8*dt);
        let point=pointOnRoute(route,distance);
        while(distance>route.progress&&occupied.some(other=>Math.hypot(point.x-other.x,point.y-other.y)<route.radius+other.radius+2)){
          distance=Math.max(route.progress,distance-2);
          point=pointOnRoute(route,distance);
        }
        route.progress=distance;
        route.ball.style.left=`${point.x}px`;
        route.ball.style.top=`${point.y}px`;
        occupied.push({x:point.x,y:point.y,radius:route.radius});
      }
      if(routes.every(route=>route.progress>=route.total-.1))resolve();
      else requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function release(){
  const frame=screen.getBoundingClientRect();
  const routes=candies.map((source,i)=>{
    const group=letterGroups[i];
    const path=strokePaths[i].map(([x,y])=>screenPoint(group,x,y));
    if(i===1)path.push(screenPoint(group,790.35,620));
    if(i===4)path.push(screenPoint(group,610.5,1336));
    for(let j=i+1;j<5;j++){
      const [x,top,bottom]=railEdges[j];
      path.push(screenPoint(letterGroups[j],x,top),screenPoint(letterGroups[j],x,bottom));
    }
    if(i<5){
      path.push(screenPoint(letterGroups[5],790.28,1339));
      if(i===4){
        path.push(screenPoint(letterGroups[5],790.28,1546));
        path.push(screenPoint(letterGroups[5],780,1565));
        path.push(screenPoint(letterGroups[5],762,1576));
      }
      path.push(screenPoint(letterGroups[5],...bottomSlots[i]));
    }
    const sourceRect=source.getBoundingClientRect();
    const actual={x:sourceRect.left+sourceRect.width/2-frame.left,y:sourceRect.top+sourceRect.height/2-frame.top};
    const correction={x:actual.x-path[0].x,y:actual.y-path[0].y};
    path.forEach(point=>{point.x+=correction.x;point.y+=correction.y});
    const center=path[0];
    const radius=Number(source.getAttribute('r'))*(group.getScreenCTM()?.a||frame.width/800);
    const ball=document.createElement('i');
    ball.className='falling-ball';
    ball.style.cssText=`left:${center.x}px;top:${center.y}px;width:${radius*2}px;height:${radius*2}px;background:${source.getAttribute('fill')};transform:translate(-50%,-50%)`;
    opening.appendChild(ball);
    source.style.visibility='hidden';
    fallingBalls.push(ball);
    const lengths=[0];
    for(let j=1;j<path.length;j++)lengths.push(lengths[j-1]+Math.hypot(path[j].x-path[j-1].x,path[j].y-path[j-1].y));
    const total=lengths.at(-1)||1;
    return {ball,points:path,lengths,total,radius,progress:0,delay:i*180,duration:Math.max(650,Math.min(4300,600+total*5.4))};
  });
  return animateStrokeRoutes(routes);
}
const rainColors=candies.map(circle=>circle.getAttribute('fill'));
function addRainBalls(){
  const cx=screen.clientWidth/2,spread=Math.min(screen.clientWidth*.44,170);
  const lanes=[-1,-.6,-.2,.2,.6,1,-.8,-.4,0,.4,.8,0,-.9,-.5,-.1,.3,.7,.95];
  const diameter=fallingBalls[0]?.offsetWidth||20;
  const added=[];
  for(let i=0;i<18;i++){
    const ball=document.createElement('i');
    const size=diameter;
    ball.className='falling-ball';
    ball.style.cssText=`left:${cx+lanes[i]*spread}px;top:${-size-i*17}px;width:${size}px;height:${size}px;background:${rainColors[i%rainColors.length]};transform:translate(-50%,-50%)`;
    screen.appendChild(ball);fallingBalls.push(ball);added.push(ball);
  }
  return added;
}
function fallAndPile(){
  play(whooshAudio,.5);
  const height=screen.clientHeight;
  const frame=screen.getBoundingClientRect();
  for(const ball of fallingBalls){
    const rect=ball.getBoundingClientRect();
    const x=rect.left+rect.width/2-frame.left,y=rect.top+rect.height/2-frame.top;
    screen.appendChild(ball);
    ball.style.left=`${x}px`;
    ball.style.top=`${y}px`;
  }
  const makeBody=(ball,i)=>({ball,x:parseFloat(ball.style.left),y:parseFloat(ball.style.top),r:ball.offsetWidth/2,vx:i<6?[-2.2,-1.4,1.8,2.3,-2.5,2.6][i]:(((i*7)%5)-2)*.8,vy:0,landed:false,isRain:i>=6});
  const bodies=fallingBalls.map(makeBody);
  let last=performance.now(),frames=0,informationStarted=false,landedCount=0,lastPop=0;
  const startIndex=bodies.length;
  addRainBalls().forEach((ball,j)=>bodies.push(makeBody(ball,startIndex+j)));
  function step(now){
    const dt=Math.min((now-last)/16.67,2);last=now;frames++;
    for(const body of bodies){
      body.vy+=.55*dt;
      body.vx*=.992;
      body.x+=body.vx*dt;
      body.y+=body.vy*dt;
      const wall=body.r+3,rightWall=screen.clientWidth-wall;
      if(body.x<wall){body.x=wall;body.vx=Math.abs(body.vx)*.65}
      if(body.x>rightWall){body.x=rightWall;body.vx=-Math.abs(body.vx)*.65}
      const floor=height-body.r-5;
      if(body.y>floor){
        body.y=floor;body.vy=Math.abs(body.vy)<.6?0:-body.vy*.43;body.vx*=.97;
        if(!body.landed){
          body.landed=true;landedCount++;if(now-lastPop>90){play(popAudio,.32);lastPop=now}
        }
      }
    }
    for(let pass=0;pass<8;pass++){
      for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
        const a=bodies[i],b=bodies[j],dx=b.x-a.x,dy=b.y-a.y;
        const dist=Math.hypot(dx,dy)||.001,min=a.r+b.r+1;
        if(dist>=min)continue;
        const nx=dx/dist,ny=dy/dist,push=(min-dist)/2;
        a.x-=nx*push;b.x+=nx*push;a.y-=ny*push;b.y+=ny*push;
        const impact=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(impact<0){const force=-impact*.28;a.vx-=force*nx;b.vx+=force*nx;a.vy-=force*ny;b.vy+=force*ny}
      }
      for(const body of bodies){
        const floor=height-body.r-5;
        body.x=Math.max(body.r+3,Math.min(screen.clientWidth-body.r-3,body.x));
        body.y=Math.min(body.y,floor);
      }
    }
    for(const body of bodies){body.ball.style.left=`${body.x}px`;body.ball.style.top=`${body.y}px`}
    if(!informationStarted&&landedCount>=2&&track.scrollTop>=opening.offsetHeight*.72){informationStarted=true;startFinalTyping()}
    if(frames<360)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function autoScrollToInvitation(){
  const start=track.scrollTop,target=opening.offsetHeight;
  const startTime=performance.now(),duration=2300;
  function advance(now){
    const t=Math.min(1,(now-startTime)/duration);
    const eased=1-Math.pow(1-t,3);
    track.scrollTop=start+(target-start)*eased;
    if(t<1)requestAnimationFrame(advance);
    else track.classList.add('unlocked');
  }
  requestAnimationFrame(advance);
}
function run(){
  const preview=new URLSearchParams(location.search).get('preview');
  if(preview==='opening')return;
  if(preview==='converged'){letterGroups.forEach(group=>group.classList.add('aligned'));return}
  if(preview==='final'){finalScreen.classList.add('visible');track.scrollTop=opening.offsetHeight;track.classList.add('unlocked');document.querySelectorAll('.detail-box.pending').forEach(b=>b.classList.remove('pending'));finalChars.forEach(c=>c.style.visibility='visible');showCallouts();return}
  if(reducedMotion){finalScreen.classList.add('visible');track.scrollTop=opening.offsetHeight;track.classList.add('unlocked');startFinalTyping();return}
  letterGroups.forEach((group,i)=>setTimeout(()=>group.classList.add('aligned'),600+i*240));
  setTimeout(async()=>{
    await release();
    setTimeout(()=>{
      finalScreen.classList.add('visible','awaiting');
      autoScrollToInvitation();
      setTimeout(fallAndPile,950);
    },500);
  },3100);
}
run();
</script>
</body>
</html>
