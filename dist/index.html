function play(audio,volume){if(!soundEnabled)return;try{const a=audio.cloneNode();a.volume=volume;a.play().catch(()=>{})}catch(e){}}
function triggerHaptic(){if('vibrate' in navigator)navigator.vibrate(6)}
function wrapFinalNodes(node){let result='';node.childNodes.forEach(child=>{if(child.nodeType===3){for(const ch of child.textContent)result+=`<span class="fch" style="display:none;">${ch==='<'?'&lt;':ch==='&'?'&amp;':ch}</span>`}else if(child.nodeType===1){const tag=child.tagName.toLowerCase();if(tag==='br')result+='<br/>';else{let attrs='';for(const attr of child.attributes)attrs+=` ${attr.name}="${attr.value}"`;result+=`<${tag}${attrs}>${wrapFinalNodes(child)}</${tag}>`}}});return result}
const tempMain=document.createElement('div');tempMain.innerHTML=FINAL_MAIN_HTML;document.getElementById('final-main-text').innerHTML=wrapFinalNodes(tempMain);
const tempInfo=document.createElement('div');tempInfo.innerHTML=FINAL_INFO_HTML;document.getElementById('final-info-text').innerHTML=wrapFinalNodes(tempInfo);
const tempMemb=document.createElement('div');tempMemb.innerHTML=FINAL_MEMBERS_HTML;document.getElementById('final-members-text').innerHTML=wrapFinalNodes(tempMemb);
const finalChars=[...document.querySelectorAll('.fch')];
function startFinalTyping(){finalScreen.classList.add('visible');if(reducedMotion){document.querySelectorAll('.detail-box.pending').forEach(b=>b.classList.remove('pending'));finalChars.forEach(c=>c.style.display='inline');document.querySelectorAll('.final-cta-btn').forEach(a=>a.classList.add('visible'));return}if(soundEnabled){typeAudio.volume=.6;typeAudio.playbackRate=1.5;typeAudio.currentTime=0;typeAudio.play().catch(()=>{})}let fIdx=0;const timer=setInterval(()=>{if(fIdx<finalChars.length){finalChars[fIdx].closest('.detail-box')?.classList.remove('pending');finalChars[fIdx].style.display='inline';triggerHaptic();fIdx++;finalScreen.scrollTop=Math.max(0,finalScreen.scrollHeight-finalScreen.clientHeight)}else{clearInterval(timer);typeAudio.pause();typeAudio.loop=false;document.querySelector('.final-cta-wrap').classList.remove('pending');document.querySelectorAll('.final-cta-btn').forEach(a=>a.classList.add('visible'))}},38)}
const candies=[...svg.querySelectorAll('#poster-candies .candy')];
const letterIds=['MOK-2','EH-2','GUL-2','LIN-2','SA-2','TANG-2'];
candies.forEach((ball,i)=>document.getElementById(letterIds[i]).appendChild(ball));
const trails=[
  [[0,0],[-45,0],[-45,250],[-45,660],[-45,1100]],
  [[0,0],[50,0],[50,200],[50,550],[50,900]],
  [[0,0],[10,0],[10,180],[10,470],[10,750]],
  [[0,0],[-35,0],[-35,130],[-35,280],[-35,430]],
  [[0,0],[30,0],[30,75],[30,165],[30,260]],
  [[0,0],[0,12],[0,25],[0,40]]
];
const palette=['#22b3a5','#df90bd','#ffeb00','#9870ad','#ef5632','#61c4e3'];
const pieces=[];
function scatter(ball,seed){
  const screenBox=screen.getBoundingClientRect(),box=ball.getBoundingClientRect();
  const x=box.left+box.width/2-screenBox.left,y=box.top+box.height/2-screenBox.top;
  const w=screen.clientWidth,h=screen.clientHeight;
  for(let i=0;i<42;i++){
    const piece=document.createElement('i');
    piece.className='confetti';
    const size=5+(i%4)*2;
    piece.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-radius:${i%3===0?'2px':'50%'};background:${palette[(i+seed)%palette.length]}`;
    screen.appendChild(piece);pieces.push(piece);
    const col=(i*17+seed*11)%14,row=(i*7+seed*13)%18;
    const jitterX=(((i*73+seed*19)%13)/13-.5)*.76;
    const jitterY=(((i*47+seed*29)%11)/11-.5)*.76;
    const endX=(col+.5+jitterX)/14*w,endY=(row+.5+jitterY)/18*h;
    const anim=piece.animate([
      {transform:'translate(-50%,-50%) scale(.45) rotate(0deg)'},
      {transform:`translate(${endX-x}px,${endY-y}px) scale(1) rotate(${(i%2?1:-1)*180}deg)`}
    ],{duration:750+(i%5)*50,easing:'cubic-bezier(.12,.68,.2,1)',fill:'forwards'});
    anim.onfinish=()=>{piece.style.left=`${endX}px`;piece.style.top=`${endY}px`;piece.style.transform='translate(-50%,-50%)';piece.dataset.y=String(endY);anim.cancel()};
  }
}
function release(){
  play(whooshAudio,.5);
  candies.forEach((ball,i)=>{
    const points=trails[i];
    ball.animate(points.map((p,j)=>({transform:`translate(${p[0]}px,${p[1]}px)`,offset:j/(points.length-1)})),{duration:1100,delay:i*145,easing:'linear',fill:'forwards'});
    setTimeout(()=>{scatter(ball,i);ball.style.visibility='hidden';play(popAudio,.5)},950+i*145);
  });
}
function clearConfetti(){
  const h=screen.clientHeight;
  pieces.forEach((piece,i)=>{
    const y=Number(piece.dataset.y||0);
    piece.animate([
      {transform:'translate(-50%,-50%) rotate(0deg)'},
      {transform:`translate(-50%,${h-y+55}px) rotate(${(i%2?1:-1)*360}deg)`}
    ],{duration:800+(i%5)*70,easing:'ease-in',fill:'forwards'}).onfinish=()=>piece.remove();
  });
}
function run(){
  const preview=new URLSearchParams(location.search).get('preview');
  if(preview==='opening')return;
  if(preview==='converged'){opening.classList.add('converged');return}
  if(preview==='final'){opening.style.display='none';finalScreen.classList.add('visible');document.querySelectorAll('.detail-box.pending').forEach(b=>b.classList.remove('pending'));finalChars.forEach(c=>c.style.display='inline');document.querySelectorAll('.final-cta-btn').forEach(a=>a.classList.add('visible'));return}
  if(reducedMotion){opening.style.display='none';startFinalTyping();return}
  setTimeout(()=>opening.classList.add('converged'),700);
  setTimeout(release,2150);
  setTimeout(()=>{startFinalTyping();opening.classList.add('sliding')},4250);
  setTimeout(clearConfetti,5250);
}
run();
</script>
</body>
</html>
